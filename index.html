<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — MediReach AI</title>
  <meta name="description" content="AI-Powered Rural Healthcare Medicine Distribution & Decision Intelligence Platform"/>
  <meta name="keywords" content="healthcare, rural healthcare, AI medicine distribution, shortage prediction, medical supply chain, WHO compliance"/>
  <meta name="author" content="MediReach AI Team"/>
  <meta name="robots" content="index, follow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="static/css/main.css"/>
  
  <style>
    /* Glowing Orbs styling inside login page */
    .login-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 1;
      overflow: hidden;
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: .15;
    }
    .orb-primary {
      width: 400px;
      height: 400px;
      background: var(--primary);
      top: -100px;
      left: -100px;
      animation: float 20s infinite alternate;
    }
    .orb-cyan {
      width: 300px;
      height: 300px;
      background: var(--cyan);
      bottom: -50px;
      right: -50px;
      animation: float 15s infinite alternate-reverse;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }
  </style>
</head>
<body>

<!-- NEURAL CANVAS BACKGROUND -->
<canvas id="neural-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.4"></canvas>

<div class="login-wrapper">
  <!-- GLOWING ORBS FOR DEPTH -->
  <div class="glow-orb orb-primary"></div>
  <div class="glow-orb orb-cyan"></div>

  <div class="login-container animate-in">
    <!-- APP LOGO -->
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" stroke="url(#lg2)" stroke-width="2"/>
          <path d="M14 7v14M7 14h14" stroke="url(#lg2)" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="lg2" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#2563EB"/>
              <stop offset="1" stop-color="#06B6D4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h2>MediReach <span class="brand-ai">AI</span></h2>
      <p class="brand-tag">Decision Intelligence &amp; Distribution</p>
    </div>

    <!-- GLASS LOGIN/SIGNUP CARD -->
    <div class="card login-card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem; border-radius: 20px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.4);">
      
      <!-- TABS -->
      <div class="portal-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: rgba(255,255,255,0.02); padding: 0.3rem; border-radius: 10px; border: 1px solid var(--border);">
        <button class="portal-tab active" id="tab-signin" onclick="switchAuthTab('signin')" style="flex: 1; padding: 0.6rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: var(--primary); color: #fff;">Sign In</button>
        <button class="portal-tab" id="tab-signup" onclick="switchAuthTab('signup')" style="flex: 1; padding: 0.6rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: transparent; color: var(--text3);">Sign Up</button>
      </div>

      <!-- FORM ERROR NOTIFICATION -->
      <div id="auth-alert" class="alert alert-critical" style="display: none; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.78rem; margin-bottom: 1rem; font-weight: 600;"></div>

      <!-- SCREEN 1: SIGN IN -->
      <form id="form-signin" onsubmit="handleSignIn(event)" class="auth-screen" style="display: flex; flex-direction: column;">
        <h3 class="auth-title" style="margin-bottom: 0.25rem;">Welcome Back</h3>
        <p class="auth-desc" style="font-size: 0.8rem; color: var(--text3); margin-bottom: 1.5rem;">Sign in with your email to access your role-based dashboard.</p>
        
        <div class="form-group" style="text-align:left; margin-bottom:1rem">
          <label class="form-label">Email Address</label>
          <input type="email" id="signin-email" class="form-control" placeholder="name@facility.org" required style="width: 100%;" />
        </div>
        
        <div class="form-group" style="text-align:left; margin-bottom:1.5rem">
          <label class="form-label">Password</label>
          <input type="password" id="signin-password" class="form-control" placeholder="••••••••" required style="width: 100%;" />
        </div>
        
        <button type="submit" class="run-btn" id="signin-btn" style="width: 100%; padding: 0.75rem; border-radius: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; background: var(--primary); border: 1px solid var(--primary); color: #fff;">
          <span>Sign In to Portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </form>

      <!-- SCREEN 2: SIGN UP -->
      <form id="form-signup" onsubmit="handleSignUp(event)" class="auth-screen" style="display:none; flex-direction: column;">
        <h3 class="auth-title" style="margin-bottom: 0.25rem;">Create Account</h3>
        <p class="auth-desc" style="font-size: 0.8rem; color: var(--text3); margin-bottom: 1.5rem;">Register a new profile linked directly to Supabase authentication.</p>
        
        <div class="form-group" style="text-align:left; margin-bottom:1rem">
          <label class="form-label">Email Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="name@facility.org" required style="width: 100%;" />
        </div>
        
        <div class="form-group" style="text-align:left; margin-bottom:1rem">
          <label class="form-label">Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="Min. 6 characters" required style="width: 100%;" />
        </div>
        
        <div class="form-group" style="text-align:left; margin-bottom:1rem">
          <label class="form-label">Assigned Role</label>
          <select id="signup-role" class="form-control" onchange="handleSignUpRoleChange()" style="width: 100%; background: var(--card); color: var(--text);">
            <option value="PHC User">PHC User</option>
            <option value="District Admin">District Admin</option>
            <option value="State Admin">State Admin</option>
          </select>
        </div>
        
        <div class="form-group" id="signup-phc-group" style="text-align:left; margin-bottom:1rem">
          <label class="form-label">Assigned PHC Facility</label>
          <select id="signup-phc" class="form-control" style="width: 100%; background: var(--card); color: var(--text);">
            <!-- Populated dynamically from Supabase -->
          </select>
        </div>
        
        <div class="form-group" id="signup-district-group" style="text-align:left; margin-bottom:1.5rem; display:none">
          <label class="form-label">Assigned District Jurisdict</label>
          <select id="signup-district" class="form-control" style="width: 100%; background: var(--card); color: var(--text);">
            <option value="Adilabad">Adilabad</option>
            <option value="Bhadradri Kothagudem">Bhadradri Kothagudem</option>
            <option value="Jagtial">Jagtial</option>
            <option value="Jangaon">Jangaon</option>
            <option value="Jayashankar Bhupalpally">Jayashankar Bhupalpally</option>
            <option value="Jogulamba Gadwal">Jogulamba Gadwal</option>
            <option value="Kamareddy">Kamareddy</option>
            <option value="Karimnagar">Karimnagar</option>
            <option value="Khammam">Khammam</option>
            <option value="Kumuram Bheem">Kumuram Bheem</option>
            <option value="Mahabubabad">Mahabubabad</option>
            <option value="Mahabubnagar">Mahabubnagar</option>
            <option value="Mancherial">Mancherial</option>
            <option value="Medak">Medak</option>
            <option value="Medchal-Malkajgiri">Medchal-Malkajgiri</option>
            <option value="Mulugu">Mulugu</option>
            <option value="Nagarkurnool">Nagarkurnool</option>
            <option value="Nalgonda">Nalgonda</option>
            <option value="Narayanpet">Narayanpet</option>
            <option value="Nirmal">Nirmal</option>
            <option value="Nizamabad">Nizamabad</option>
            <option value="Peddapalli">Peddapalli</option>
            <option value="Rajanna Sircilla">Rajanna Sircilla</option>
            <option value="Ranga Reddy">Ranga Reddy</option>
            <option value="Sangareddy">Sangareddy</option>
            <option value="Siddipet">Siddipet</option>
            <option value="Suryapet">Suryapet</option>
            <option value="Vikarabad">Vikarabad</option>
            <option value="Wanaparthy">Wanaparthy</option>
            <option value="Warangal Rural">Warangal Rural</option>
            <option value="Warangal Urban">Warangal Urban</option>
            <option value="Yadadri Bhuvanagiri">Yadadri Bhuvanagiri</option>
          </select>
        </div>
        
        <button type="submit" class="run-btn" id="signup-btn" style="width: 100%; padding: 0.75rem; border-radius: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; background: var(--cyan); border: 1px solid var(--cyan); color: #000;">
          <span>Register New Account</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
if (!window.supabase) {
  document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');
}
</script>
<script src="static/js/config.js"></script>
<script>
// Neural Canvas Animation
(function(){
  const canvas=document.getElementById('neural-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const nodes=Array.from({length:40},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+1,pulse:Math.random()*Math.PI*2}));
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const dark=document.documentElement.getAttribute('data-theme')!=='light';
    nodes.forEach(n=>{
      n.x+=n.vx;n.y+=n.vy;n.pulse+=.015;
      if(n.x<0||n.x>canvas.width)n.vx*=-1;
      if(n.y<0||n.y>canvas.height)n.vy*=-1;
    });
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<180){const a=(1-d/180)*.18;ctx.beginPath();ctx.strokeStyle=dark?`rgba(37,99,235,${a})`:`rgba(37,99,235,${a*.4})`;ctx.lineWidth=.6;ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();}
    }
    nodes.forEach(n=>{
      const p=(Math.sin(n.pulse)+1)*.5;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+p,0,Math.PI*2);
      ctx.fillStyle=dark?`rgba(6,182,212,${.2+p*.2})`:`rgba(37,99,235,${.1+p*.1})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// Initialize Supabase Client directly on frontend
const supabaseClient = window.supabase
  ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
  : null;

document.addEventListener("DOMContentLoaded", async () => {
  if (!supabaseClient) {
    showAlert("Critical Error: Supabase client failed to load. Check console/config.", true);
    return;
  }
  
  // Load PHC dropdown list directly from Supabase
  try {
    const { data: phcs, error } = await supabaseClient
      .from('phcs')
      .select('PHC_Code, PHC_Name, District')
      .order('PHC_Name');
      
    if (error) throw error;
    
    const selectEl = document.getElementById("signup-phc");
    if (phcs && selectEl) {
      phcs.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.PHC_Code;
        opt.textContent = `${p.PHC_Name} (${p.District})`;
        selectEl.appendChild(opt);
      });
    }
  } catch (err) {
    console.error("Error loading PHCs:", err);
  }
});

// UI Toggles
let currentTab = 'signin';
function switchAuthTab(tab) {
  currentTab = tab;
  document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
  document.getElementById('tab-signin').style.background = tab === 'signin' ? 'var(--primary)' : 'transparent';
  document.getElementById('tab-signin').style.color = tab === 'signin' ? '#fff' : 'var(--text3)';
  
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('tab-signup').style.background = tab === 'signup' ? 'var(--cyan)' : 'transparent';
  document.getElementById('tab-signup').style.color = tab === 'signup' ? '#000' : 'var(--text3)';

  document.getElementById('form-signin').style.display = tab === 'signin' ? 'flex' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'flex' : 'none';
  hideAlert();
}

function handleSignUpRoleChange() {
  const role = document.getElementById("signup-role").value;
  document.getElementById("signup-phc-group").style.display = role === 'PHC User' ? 'block' : 'none';
  document.getElementById("signup-district-group").style.display = role === 'District Admin' ? 'block' : 'none';
}

function showAlert(msg, isCrit = false) {
  const alertEl = document.getElementById("auth-alert");
  alertEl.textContent = msg;
  alertEl.className = isCrit ? "alert alert-critical" : "alert alert-success";
  alertEl.style.display = "block";
}

function hideAlert() {
  const alertEl = document.getElementById("auth-alert");
  alertEl.style.display = "none";
}

function normalizeSessionProfile(profile, authUser) {
  if (!profile && !authUser) return null;
  const source = profile || {};
  const metadata = authUser?.user_metadata || {};
  const rawRole = String(source.role || metadata.role || "").trim().toLowerCase();
  let role = "PHC User";
  if (rawRole.includes("state")) {
    role = "State Admin";
  } else if (rawRole.includes("district")) {
    role = "District Admin";
  } else if (rawRole.includes("phc")) {
    role = "PHC User";
  }

  return {
    ...source,
    id: source.id || authUser?.id,
    email: source.email || authUser?.email || "",
    username: source.username || "",
    role,
    phc_id: source.phc_id || source.phc_code || source.PHC_Code || metadata.phc_id || "",
    district: source.district || source.District || metadata.district || ""
  };
}

// Authentication Handlers
async function handleSignIn(e) {
  e.preventDefault();
  hideAlert();
  
  const email = document.getElementById("signin-email").value.trim();
  const password = document.getElementById("signin-password").value;
  const btn = document.getElementById("signin-btn");
  
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Authenticating...';
  
  try {
    // 1. Authenticate with Supabase Auth
    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    
    if (authError) throw authError;
    
    // 2. Fetch User Profile
    let { data: profile, error: profileError } = await supabaseClient
      .from('users')
      .select('*')
      .eq('id', authData.user.id)
      .maybeSingle();

    if (profileError || !profile) {
      const fallback = await supabaseClient
        .from('users')
        .select('*')
        .eq('email', email)
        .maybeSingle();
      profile = fallback.data;
      profileError = fallback.error;
    }
      
    if (profileError || !profile) {
      profile = normalizeSessionProfile(null, authData.user);
    }
    
    // Store profile in browser session and redirect to dashboard
    sessionStorage.setItem("medireach_session", JSON.stringify(normalizeSessionProfile(profile, authData.user)));
    sessionStorage.setItem("supabase_uid", authData.user.id);
    
    showAlert("Login successful! Loading dashboard...", false);
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);
    
  } catch (err) {
    console.error("Sign In Error:", err);
    showAlert(err.message || "Invalid credentials. Please try again.", true);
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Sign In to Portal';
  }
}

async function handleSignUp(e) {
  e.preventDefault();
  hideAlert();
  
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const role = document.getElementById("signup-role").value;
  const phcId = document.getElementById("signup-phc").value;
  const district = document.getElementById("signup-district").value;
  const btn = document.getElementById("signup-btn");
  
  if (role === 'PHC User' && !phcId) {
    showAlert("Please select a PHC facility.", true);
    return;
  }
  if (role === 'District Admin' && !district) {
    showAlert("Please select a district.", true);
    return;
  }
  
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Creating Account...';
  
  try {
    // Check if duplicate profile exists in users table first
    const { data: dupCheck } = await supabaseClient
      .from('users')
      .select('id')
      .eq('email', email)
      .maybeSingle();
      
    if (dupCheck) {
      throw new Error("This email address is already registered.");
    }

    // 1. Register Auth User in Supabase Auth with metadata
    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          role: role,
          phc_id: role === 'PHC User' ? phcId : null,
          district: role === 'District Admin' ? district : null
        }
      }
    });
    
    if (authError) throw authError;
    if (!authData.user) throw new Error("Account creation pending or restricted.");

    // The database trigger normally creates this row. This fallback keeps login
    // working if the trigger was not installed in Supabase.
    try {
      await supabaseClient
        .from('users')
        .upsert({
          id: authData.user.id,
          email: email,
          role: role,
          phc_id: role === 'PHC User' ? phcId : null,
          district: role === 'District Admin' ? district : null
        }, { onConflict: 'id' });
    } catch (profileErr) {
      console.warn("Profile fallback insert skipped:", profileErr);
    }
    
    showAlert("Account successfully registered! Switch to Sign In to log in.", false);
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Register New Account';
    
    setTimeout(() => {
      switchAuthTab('signin');
    }, 2000);
    
  } catch (err) {
    console.error("Sign Up Error:", err);
    showAlert(err.message || "Failed to create account. Please try again.", true);
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Register New Account';
  }
}
</script>
</body>
</html>
